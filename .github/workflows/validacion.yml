name: Validación SIGRA
on:
  push:
    branches: [jared, main]
    paths: ["SIGRA-Backend/**", "SIGRA-Prototipo/**", ".github/workflows/validacion.yml"]
  pull_request:
    paths: ["SIGRA-Backend/**", "SIGRA-Prototipo/**", ".github/workflows/validacion.yml"]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build SIGRA-Backend/SIGRA.API/SIGRA.API.csproj --configuration Release
      - run: dotnet test SIGRA-Backend/SIGRA.Tests/SIGRA.Tests.csproj --configuration Release --logger trx
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SIGRA-Prototipo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: SIGRA-Prototipo/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
