name: Validacion

on:
  push:
    branches: [main, prueba, mayeli, jared, sergio]
  pull_request:
    branches: [main, prueba]

jobs:
  backend:
    name: Backend (compilar y probar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar
        run: dotnet restore SIGRA-Backend/SIGRA.API/SIGRA.API.csproj && dotnet restore SIGRA-Backend/SIGRA.Pruebas/SIGRA.Pruebas.csproj

      - name: Compilar la API
        run: dotnet build SIGRA-Backend/SIGRA.API/SIGRA.API.csproj --no-restore -c Release

      - name: Ejecutar pruebas
        run: dotnet test SIGRA-Backend/SIGRA.Pruebas/SIGRA.Pruebas.csproj --no-restore -c Release

  frontend:
    name: Frontend (lint y compilar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SIGRA-Prototipo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SIGRA-Prototipo/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compilar
        run: npm run build
